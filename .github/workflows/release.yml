name: release

on:
  push:
    tags: ['v*']
  # A dispatch run does everything except create the release, so the signing and
  # provenance steps can be proven before a tag goes out.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Sign and attest, but do not publish a release'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read
  id-token: write       # keyless signing: the OIDC token is the identity
  attestations: write   # build provenance stored by GitHub

jobs:
  publish:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Find the successful build for this commit
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml \
            --commit "$SHA" --limit 10 --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion == "success")][0].databaseId')
          if [ -z "$RUN" ] || [ "$RUN" = "null" ]; then
            echo "No successful build for $SHA — push to main first." >&2
            exit 1
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for name in dbdesk-aarch64-apple-darwin dbdesk-x86_64-apple-darwin \
                      dbdesk-x86_64-pc-windows-msvc dbdesk-aarch64-pc-windows-msvc \
                      dbdesk-linux-x64 dbdesk-linux-arm64; do
            dir="artifacts/${name#dbdesk-}"
            gh run download "${{ steps.build.outputs.run }}" --repo "$GITHUB_REPOSITORY" \
              --name "$name" -D "$dir" || echo "missing artifact: $name"
          done
          find artifacts -maxdepth 1 -mindepth 1 -type d

      - name: Stage release files
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="0.0.0-dryrun"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p out

          pick() { find "$1" -name "$2" -print -quit 2>/dev/null || true; }

          # macOS — DMG for humans, .app.tar.gz + signature for the updater.
          ARM_DMG=$(pick artifacts/aarch64-apple-darwin '*.dmg')
          X64_DMG=$(pick artifacts/x86_64-apple-darwin '*.dmg')
          ARM_APP=$(pick artifacts/aarch64-apple-darwin '*.app.tar.gz')
          X64_APP=$(pick artifacts/x86_64-apple-darwin '*.app.tar.gz')
          cp "$ARM_DMG" "out/DB.Desk_${VERSION}_aarch64.dmg"
          cp "$X64_DMG" "out/DB.Desk_${VERSION}_x64.dmg"
          cp "$ARM_APP" "out/DB.Desk_${VERSION}_aarch64.app.tar.gz"
          cp "${ARM_APP}.sig" "out/DB.Desk_${VERSION}_aarch64.app.tar.gz.sig"
          cp "$X64_APP" "out/DB.Desk_${VERSION}_x64.app.tar.gz"
          cp "${X64_APP}.sig" "out/DB.Desk_${VERSION}_x64.app.tar.gz.sig"

          # Windows — the NSIS installer is itself the updater artefact in Tauri v2,
          # with a detached .exe.sig next to it.
          WIN_EXE=$(pick artifacts/x86_64-pc-windows-msvc '*setup.exe')
          cp "$WIN_EXE" "out/DB.Desk_${VERSION}_x64-setup.exe"
          cp "${WIN_EXE}.sig" "out/DB.Desk_${VERSION}_x64-setup.exe.sig"
          WIN_ARM=$(pick artifacts/aarch64-pc-windows-msvc '*setup.exe')
          if [ -n "$WIN_ARM" ]; then
            cp "$WIN_ARM" "out/DB.Desk_${VERSION}_arm64-setup.exe"
            cp "${WIN_ARM}.sig" "out/DB.Desk_${VERSION}_arm64-setup.exe.sig"
          fi

          # Linux — deb for Debian/Ubuntu/Mint, rpm for Fedora/RHEL/openSUSE,
          # AppImage for everyone else, and the AppImage plus its detached .sig is
          # what the updater downloads.
          for arch in x64 arm64; do
            dir="artifacts/linux-${arch}"
            cp "$(pick "$dir" '*.deb')"               "out/DB.Desk_${VERSION}_${arch}.deb"
            cp "$(pick "$dir" '*.rpm')"               "out/DB.Desk_${VERSION}_${arch}.rpm"
            appimage=$(pick "$dir" '*.AppImage')
            cp "$appimage"                            "out/DB.Desk_${VERSION}_${arch}.AppImage"
            cp "${appimage}.sig"                      "out/DB.Desk_${VERSION}_${arch}.AppImage.sig"
          done

          # The Hermes plugin, packaged from the same repository.
          PLUGIN_VERSION=$(sed -n 's/^version: *"\(.*\)"/\1/p' plugin/plugin.yaml | head -1)
          (cd plugin && zip -qr "../out/dbdesk-plugin-${PLUGIN_VERSION}.zip" \
             plugin.yaml requirements.txt __init__.py README.md LICENSE \
             desktop dashboard docs tests)
          echo "PLUGIN_VERSION=${PLUGIN_VERSION}" >> "$GITHUB_ENV"

          (cd out && sha256sum ./* > SHA256SUMS.txt)
          ls -lh out

      # Keyless signing: the identity is this workflow's OIDC token, so there is no
      # private key to leak and no key rotation to forget. A verifier pins the repository
      # and the workflow file instead of trusting a key in our keeping.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the checksum list
        run: |
          cosign sign-blob --yes \
            --bundle out/SHA256SUMS.txt.bundle \
            out/SHA256SUMS.txt

      - name: Verify the signature we just produced
        run: |
          cosign verify-blob \
            --bundle out/SHA256SUMS.txt.bundle \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/.*$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            out/SHA256SUMS.txt

      - name: Attest build provenance for every asset
        uses: actions/attest-build-provenance@v3
        with:
          subject-checksums: out/SHA256SUMS.txt

      - name: Verify the provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in out/DB.Desk_*; do
            echo "== $f"
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"
          done

      - name: Build latest.json
        run: |
          REPO="$GITHUB_REPOSITORY"
          TAG="$GITHUB_REF_NAME"
          PLATFORMS='{}'
          add() { # <platform key> <signature file> <asset file>
            if [ -f "$2" ] && [ -f "$3" ]; then
              PLATFORMS=$(jq --arg k "$1" \
                --arg s "$(cat "$2")" \
                --arg u "https://github.com/${REPO}/releases/download/${TAG}/$(basename "$3")" \
                '. + {($k): {signature: $s, url: $u}}' <<<"$PLATFORMS")
            else
              echo "skipping $1 — no signed updater artefact"
            fi
          }
          add darwin-aarch64 "out/DB.Desk_${VERSION}_aarch64.app.tar.gz.sig" "out/DB.Desk_${VERSION}_aarch64.app.tar.gz"
          add darwin-x86_64  "out/DB.Desk_${VERSION}_x64.app.tar.gz.sig"     "out/DB.Desk_${VERSION}_x64.app.tar.gz"
          add windows-x86_64 "out/DB.Desk_${VERSION}_x64-setup.exe.sig" "out/DB.Desk_${VERSION}_x64-setup.exe"
          add windows-aarch64 "out/DB.Desk_${VERSION}_arm64-setup.exe.sig" "out/DB.Desk_${VERSION}_arm64-setup.exe"
          add linux-x86_64   "out/DB.Desk_${VERSION}_x64.AppImage.sig"  "out/DB.Desk_${VERSION}_x64.AppImage"
          add linux-aarch64  "out/DB.Desk_${VERSION}_arm64.AppImage.sig" "out/DB.Desk_${VERSION}_arm64.AppImage"

          jq -n \
            --arg version "$VERSION" \
            --arg notes "See the release notes on GitHub." \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > out/latest.json
          cat out/latest.json

      - name: Keep the signed artefacts for inspection on a dry run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: |
            out/SHA256SUMS.txt
            out/SHA256SUMS.txt.bundle
            out/latest.json
          retention-days: 7

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "DB Desk ${VERSION}" --generate-notes \
            out/DB.Desk_*.dmg out/DB.Desk_*.app.tar.gz out/DB.Desk_*.app.tar.gz.sig \
            out/DB.Desk_*-setup.exe out/DB.Desk_*-setup.exe.sig \
            out/DB.Desk_*.deb out/DB.Desk_*.rpm \
            out/DB.Desk_*.AppImage out/DB.Desk_*.AppImage.sig \
            out/dbdesk-plugin-*.zip \
            out/latest.json out/SHA256SUMS.txt out/SHA256SUMS.txt.bundle
