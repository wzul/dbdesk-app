name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Find the successful build for this commit
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml \
            --commit "$SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN" ] || [ "$RUN" = "null" ]; then
            echo "No successful build for $SHA — push to main first." >&2
            exit 1
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.build.outputs.run }}" --repo "$GITHUB_REPOSITORY" \
            --name dbdesk-aarch64-apple-darwin -D artifacts/arm64
          gh run download "${{ steps.build.outputs.run }}" --repo "$GITHUB_REPOSITORY" \
            --name dbdesk-x86_64-apple-darwin -D artifacts/x64

      - name: Stage release files
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p out
          mv artifacts/arm64/*.dmg "out/DB.Desk_${VERSION}_aarch64.dmg"
          mv artifacts/x64/*.dmg "out/DB.Desk_${VERSION}_x64.dmg"
          mv artifacts/arm64/*.app.tar.gz "out/DB.Desk_${VERSION}_aarch64.app.tar.gz"
          mv artifacts/arm64/*.app.tar.gz.sig "out/DB.Desk_${VERSION}_aarch64.app.tar.gz.sig"
          mv artifacts/x64/*.app.tar.gz "out/DB.Desk_${VERSION}_x64.app.tar.gz"
          mv artifacts/x64/*.app.tar.gz.sig "out/DB.Desk_${VERSION}_x64.app.tar.gz.sig"
          (cd out && sha256sum *.dmg > SHA256SUMS.txt)

      - name: Build latest.json
        run: |
          REPO="$GITHUB_REPOSITORY"
          TAG="$GITHUB_REF_NAME"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "See the release notes on GitHub." \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig_arm "$(cat out/DB.Desk_${VERSION}_aarch64.app.tar.gz.sig)" \
            --arg sig_x64 "$(cat out/DB.Desk_${VERSION}_x64.app.tar.gz.sig)" \
            --arg url_arm "https://github.com/${REPO}/releases/download/${TAG}/DB.Desk_${VERSION}_aarch64.app.tar.gz" \
            --arg url_x64 "https://github.com/${REPO}/releases/download/${TAG}/DB.Desk_${VERSION}_x64.app.tar.gz" \
            '{version: $version, notes: $notes, pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": {signature: $sig_arm, url: $url_arm},
                "darwin-x86_64": {signature: $sig_x64, url: $url_x64}
              }}' > out/latest.json
          cat out/latest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "DB Desk ${VERSION}" --generate-notes \
            out/*.dmg out/*.app.tar.gz out/*.app.tar.gz.sig out/latest.json out/SHA256SUMS.txt
