name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install UI dependencies
        run: npm --prefix ui ci
      - name: Build UI
        run: npm --prefix ui run build
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run smoke tests
        run: python -m unittest discover -s tests -v

  macos:
    needs: backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      HAS_SIGNING: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix ui ci
          python -m pip install -r backend/requirements-dev.txt

      - name: Build UI
        run: npm --prefix ui run build

      - name: Build Python sidecar
        run: scripts/build-sidecar.sh

      - name: Sign the sidecar
        if: env.HAS_SIGNING == 'true'
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          codesign --force --timestamp --options runtime \
            --entitlements src-tauri/entitlements.plist \
            --sign "$APPLE_SIGNING_IDENTITY" \
            "src-tauri/binaries/dbdesk-server-$TRIPLE"

      - name: Build the app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Verify signature
        if: env.HAS_SIGNING == 'true'
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/DB Desk.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: dbdesk-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
