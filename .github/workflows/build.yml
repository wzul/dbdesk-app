name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install UI dependencies
        run: npm --prefix ui ci
      - name: Build UI
        run: npm --prefix ui run build
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run smoke tests
        run: python -m unittest discover -s tests -v

      # plugin/ is generated from the app sources; a stale copy is how the two
      # releases drifted apart before they shared a repository.
      - name: Check the generated plugin is current
        run: python scripts/build-plugin.py --check

      - name: Run the plugin's own test suite
        run: cd plugin && bash tests/run.sh

  macos:
    needs: backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            target: x86_64-apple-darwin
          - runner: macos-26
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      HAS_SIGNING: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
      HAS_UPDATER: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix ui ci
          python -m pip install -r backend/requirements-dev.txt

      - name: Build UI
        run: npm --prefix ui run build

      - name: Build Python sidecar
        run: scripts/build-sidecar.sh

      - name: Sign the sidecar
        if: env.HAS_SIGNING == 'true'
        run: |
          # onedir sidecar: --deep signs the binary and its nested dylibs
          codesign --force --deep --timestamp --options runtime \
            --entitlements src-tauri/entitlements.plist \
            --sign "$APPLE_SIGNING_IDENTITY" \
            "src-tauri/sidecar/dbdesk-server/dbdesk-server"

      - name: Build the app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Unset signing variables when they are empty secrets, otherwise Tauri
          # tries to import an empty certificate and the bundle step fails.
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                  APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                  APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH
          fi
          ARGS=(--target "${{ matrix.target }}")
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            ARGS+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          npm run tauri build -- "${ARGS[@]}"

      - name: Verify signature
        if: env.HAS_SIGNING == 'true'
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/DB Desk.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Check updater artifacts
        if: env.HAS_UPDATER == 'true'
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/DB Desk.app.tar.gz"
          test -f "$APP"
          test -f "$APP.sig"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: dbdesk-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: warn

  # Windows on ARM builds now that the PostgreSQL driver falls back to pure-Python
  # pg8000 (psycopg-binary has no win_arm64 wheel); PyInstaller still has to run on
  # the matching architecture, hence one runner per target.
  windows:
    needs: backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            arch: x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      HAS_UPDATER: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix ui ci
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Build UI
        run: npm --prefix ui run build

      - name: Build Python sidecar
        shell: bash
        env:
          PYTHON: python
        run: scripts/build-sidecar.sh

      - name: Build the app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ARGS=(--target "${{ matrix.target }}" --bundles nsis)
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            ARGS+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          npm run tauri build -- "${ARGS[@]}"

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: dbdesk-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
          if-no-files-found: warn

  # deb → Debian, Ubuntu, Mint, Pop!_OS · rpm → Fedora, RHEL, openSUSE · AppImage runs
  # anywhere with a recent glibc. PyInstaller cannot cross-compile the sidecar, so
  # each architecture is built on its own native runner.
  linux:
    needs: backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: x64
          - runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      HAS_UPDATER: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable

      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf file rpm libfuse2

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix ui ci
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Build UI
        run: npm --prefix ui run build

      - name: Build Python sidecar
        env:
          PYTHON: python
        run: scripts/build-sidecar.sh

      - name: Build the app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ARGS=(--bundles deb,rpm,appimage)
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            ARGS+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          npm run tauri build -- "${ARGS[@]}"

      - name: Report the glibc floor
        run: |
          ldd --version | head -1
          objdump -T src-tauri/target/release/dbdesk | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1

      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: dbdesk-linux-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: warn
