<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>DB Desk</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1f2328;
        --muted: #818b98;
        --accent: #0969da;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --fg: #e6edf3;
          --muted: #6e7681;
          --accent: #4493f8;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .mark {
        width: 56px; height: 56px; border-radius: 14px;
        background: var(--accent);
        display: flex; align-items: center; justify-content: center;
      }
      .mark svg { width: 32px; height: 32px; }
      .name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
      .hint { font-size: 11.5px; color: var(--muted); }
      .bar {
        width: 132px; height: 2px; border-radius: 2px;
        background: color-mix(in srgb, var(--muted) 30%, transparent);
        overflow: hidden;
      }
      .bar::after {
        content: '';
        display: block; width: 40%; height: 100%;
        border-radius: 2px; background: var(--accent);
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(330%); }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
          <ellipse cx="12" cy="6" rx="7" ry="3" />
          <path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6" />
          <path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3" />
        </svg>
      </div>
      <div class="name">DB Desk</div>
      <div class="bar"></div>
      <div class="hint">Starting the local database engine…</div>
    </div>
  </body>
</html>
