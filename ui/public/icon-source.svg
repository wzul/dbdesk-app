<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Source for the installable-app icons; scripts/make-icons.py renders the PNGs. -->
  <!-- Full-bleed on purpose: the OS applies its own mask, and a rounded square
       with transparent corners reads as a cropped icon on Android and iOS. -->
  <rect width="512" height="512" fill="#2563eb"/>
  <g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round">
    <ellipse cx="256" cy="176" rx="104" ry="44"/>
    <path d="M152 176v176c0 24 46 44 104 44s104-20 104-44V176"/>
    <path d="M152 264c0 24 46 44 104 44s104-20 104-44"/>
  </g>
</svg>
