# dbdesk.app — static site behind a Cloudflare tunnel.
# The container is never published on a host port: the only way in is cloudflared.
# Mounted at /etc/nginx/conf.d/default.conf; headers.conf is mounted beside it.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    include /etc/nginx/dbdesk/headers.conf;

    # www → apex, so there is one canonical URL.
    if ($host = www.dbdesk.app) {
        return 301 https://dbdesk.app$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Version manifest for the download buttons, refreshed by the manifest sidecar.
    location = /release/latest.json {
        include /etc/nginx/dbdesk/headers.conf;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location ~* \.(?:webp|png|jpg|jpeg|gif|svg|ico|woff2)$ {
        include /etc/nginx/dbdesk/headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js)$ {
        include /etc/nginx/dbdesk/headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/dbdesk/headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
