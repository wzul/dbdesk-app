<!doctype html>
<html lang="en">
<head><meta charset="utf-8">
<style>
  @page { margin: 0 }
  * { box-sizing: border-box; margin: 0 }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #ffffff;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    color: #0f172a;
    -webkit-font-smoothing: antialiased;
  }
  .canvas { position: relative; width: 1200px; height: 630px; }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(760px 380px at 18% -12%, rgba(37,99,235,.12), transparent 68%),
      radial-gradient(600px 300px at 96% 8%, rgba(37,99,235,.08), transparent 70%);
  }
  .rule { position: absolute; left: 64px; right: 64px; top: 0; height: 1px; background: #e2e8f0 }
  .brand { position: absolute; left: 64px; top: 56px; display: flex; align-items: center; gap: 12px }
  .mark { width: 40px; height: 40px; border-radius: 11px; background: #2563eb; display: grid; place-items: center }
  .mark svg { width: 24px; height: 24px }
  .brand span { font-size: 25px; font-weight: 660; letter-spacing: -0.02em }

  h1 {
    position: absolute; left: 64px; top: 126px; width: 506px;
    font-size: 57px; line-height: 1.04; letter-spacing: -0.034em; font-weight: 700;
  }
  h1 em { font-style: normal; color: #2563eb }
  p.sub {
    position: absolute; left: 64px; top: 352px; width: 476px;
    font-size: 19px; line-height: 1.45; color: #334155;
  }
  .chips { position: absolute; left: 64px; top: 470px; display: flex; flex-wrap: wrap; gap: 8px; width: 492px }
  .chip {
    border: 1px solid #e2e8f0; background: #fff; border-radius: 999px;
    padding: 6px 13px; font-size: 14.5px; font-weight: 550; color: #334155;
  }
  .foot { position: absolute; left: 64px; bottom: 36px; font-size: 15px; color: #64748b; display:flex; gap: 10px; align-items:center }
  .dot { width: 7px; height: 7px; border-radius: 999px; background: #16a34a }

  .shot {
    position: absolute; right: 0; top: 104px; width: 590px; height: 464px;
    border: 1px solid #e2e8f0; border-right: 0; border-radius: 14px 0 0 14px;
    background: #fff; padding: 8px; box-shadow: 0 30px 70px -24px rgba(15,23,42,.28);
    overflow: hidden;
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top left; border-radius: 8px 0 0 8px }
</style>
</head>
<body>
<div class="canvas">
  <div class="bg"></div>
  <div class="rule"></div>

  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round">
        <ellipse cx="12" cy="7" rx="6.2" ry="2.6"/>
        <path d="M5.8 7v10.4c0 1.5 2.8 2.6 6.2 2.6s6.2-1.1 6.2-2.6V7"/>
        <path d="M5.8 12.4c0 1.5 2.8 2.6 6.2 2.6s6.2-1.1 6.2-2.6"/>
      </svg>
    </div>
    <span>DB Desk</span>
  </div>

  <h1>Every database you touch, <em>one native Mac app.</em></h1>
  <p class="sub">A TablePlus-style browser with read-only guards, schema-only AI, and an MCP server for your agents.</p>

  <div class="chips">
    <span class="chip">PostgreSQL</span>
    <span class="chip">MySQL</span>
    <span class="chip">ClickHouse</span>
    <span class="chip">SQLite</span>
    <span class="chip">MongoDB</span>
    <span class="chip">Redis</span>
    <span class="chip">MCP</span>
  </div>

  <div class="foot"><span class="dot"></span> dbdesk.app — macOS, local-first</div>

  <div class="shot"><img src="../assets/img/standalone.png" alt=""></div>
</div>
</body>
</html>
